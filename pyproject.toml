[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all2md"
version = "0.3.0"
description = "Convert documents into Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "azure-ai-contentunderstanding>=1.2.0b1",
  "firecrawl-anydoc>=0.1.8",
  "liteparse>=2.11.1",
  "markitdown[all]>=0.1.7",
  "typer>=0.12.3",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "python-multipart>=0.0.6"
]

[project.optional-dependencies]
docling = [
  "cryptography>=50.0.0",
  "docling>=2.0.0",
  "pypdfium2>=5.12.1"
]
dev = [
  "httpx2>=2.10.0",
  "pip-audit>=2.9.0",
  "pytest>=9.0.0",
  "ruff>=0.12.0"
]

[project.scripts]
all2md = "all2md.cli:app"
all2md-server = "all2md.server:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
